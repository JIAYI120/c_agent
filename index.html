<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>贝贝</title>
  <style>
    :root {
      --bg: #000000;
      --glass: rgba(28,28,30,0.60);
      --glass-light: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.10);
      --glass-highlight: rgba(255,255,255,0.06);
      --text: #ffffff;
      --text2: rgba(235,235,245,0.80);
      --text3: rgba(235,235,245,0.30);
      --accent: #0a84ff;
      --accent-soft: rgba(10,132,255,0.18);
      --ok: #30d158;
      --warn: #ff9f0a;
      --err: #ff453a;
      --purple: #bf5af2;
      --sep: rgba(255,255,255,0.06);
      --r-pill: 42px;
      --r-card: 16px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar,
    .screen::-webkit-scrollbar, .chat-log::-webkit-scrollbar,
    .filters::-webkit-scrollbar, .sheet::-webkit-scrollbar {
      display: none;
    }
    html, body, .screen, .chat-log, .filters, .sheet { scrollbar-width: none; }

    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh;
      background: linear-gradient(160deg, #060608 0%, #000 40%, #020210 100%);
    }

    #phone {
      width: min(100vw, 430px);
      height: min(100dvh, 932px);
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Ambient light glow */
    #phone::before {
      content: "";
      position: absolute;
      top: -160px; left: 50%; transform: translateX(-50%);
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(10,132,255,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    @media (min-width: 440px) and (min-height: 720px) {
      body { padding: 20px; }
      #phone {
        border-radius: 52px;
        border: 0.5px solid rgba(255,255,255,0.06);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.03),
          0 40px 100px rgba(0,0,0,0.65),
          inset 0 0.5px 0 rgba(255,255,255,0.05);
      }
    }

    /* ── Status bar ── */
    .statusbar {
      flex: 0 0 54px;
      padding: 16px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 15px;
      font-weight: 600;
      position: relative; z-index: 2;
    }
    .statusbar .right { display: flex; gap: 8px; align-items: center; }
    .pill {
      font-size: 11px; font-weight: 600;
      padding: 2px 10px 3px;
      border-radius: 10px;
      letter-spacing: 0.01em;
    }
    .pill.ok { color: var(--ok); background: rgba(48,209,88,0.10); }

    /* ── Large title ── */
    .large-title {
      flex: 0 0 auto;
      padding: 2px 24px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative; z-index: 2;
    }
    .large-title .text { flex: 1; }
    .large-title h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.08;
    }
    .large-title .sub {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--text3);
      visibility: hidden;
    }

    /* ── Content ── */
    main {
      flex: 1 1 0;
      overflow: hidden;
      position: relative;
      z-index: 1;
      padding-bottom: 8px;
    }
    .screen {
      position: absolute; inset: 0;
      overflow-y: auto;
      padding: 4px 0 16px;
      display: none;
    }
    .screen.active { display: block; }

    /* ── Glass surfaces ── */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(50px) saturate(200%);
      -webkit-backdrop-filter: blur(50px) saturate(200%);
      border: 0.5px solid var(--glass-border);
      position: relative;
    }
    /* Highlight edge */
    .glass::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 1px 0 var(--glass-highlight);
    }

    /* ── Stats ── */
    .stats-row {
      display: flex;
      gap: 10px;
      padding: 0 16px 14px;
    }
    .stat-card {
      flex: 1;
      padding: 18px;
      border-radius: var(--r-card);
    }
    .stat-card .n {
      font-size: 34px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .stat-card .l {
      font-size: 13px;
      color: var(--text3);
      margin-top: 5px;
    }

    /* ── Filter chips ── */
    .filters {
      display: flex;
      gap: 8px;
      padding: 0 16px 14px;
    }
    .fchip {
      flex: 1;
      border: none;
      background: rgba(255,255,255,0.05);
      color: var(--text2);
      border-radius: 20px;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      text-align: center;
    }
    .fchip.on {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 14px rgba(10,132,255,0.30);
    }

    /* ── Entry list ── */
    .entry-group {
      margin: 0 16px 16px;
      border-radius: var(--r-card);
      overflow: hidden;
    }
    .row-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--sep);
      cursor: pointer;
      transition: background 0.12s;
    }
    .row-item:last-child { border-bottom: none; }
    .row-item:active { background: rgba(255,255,255,0.02); }
    .row-item .body { flex: 1; min-width: 0; }
    .row-item .title { font-size: 17px; margin: 0 0 3px; }
    .row-item .desc {
      font-size: 14px; color: var(--text3); margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-item .chevron { color: rgba(255,255,255,0.12); font-size: 18px; margin-left: 10px; }
    .row-item .meta { display: flex; gap: 6px; margin-top: 7px; }
    .badge {
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 8px;
      background: rgba(255,255,255,0.05); color: var(--text2);
    }
    .badge.ok { background: rgba(48,209,88,0.10); color: var(--ok); }
    .badge.warn { background: rgba(255,159,10,0.10); color: var(--warn); }

    /* ── FAB (inline, beside title) ── */
    .fab {
      width: 38px; height: 38px;
      border-radius: 19px;
      border: none;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      color: var(--accent);
      font-size: 22px;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
      margin-top: 8px;
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.08);
    }
    .fab:active { transform: scale(0.88); background: rgba(255,255,255,0.10); }

    /* ── Chat ── */
    .chat-wrap { display: flex; flex-direction: column; height: 100%; }
    .chat-log { flex: 1; overflow-y: auto; padding: 12px 16px 16px; }
    .bubble {
      max-width: 80%;
      width: fit-content;
      margin: 0 0 14px;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      animation: in 0.28s cubic-bezier(0.32,0.72,0,1);
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: none; }
    }
    .bubble.user {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 6px;
    }
    .bubble.bot {
      background: var(--glass);
      backdrop-filter: blur(30px);
      border-bottom-left-radius: 6px;
      border: 0.5px solid var(--glass-border);
    }
    .bubble .refs {
      margin-top: 12px; padding-top: 12px;
      border-top: 0.5px solid var(--sep);
      display: flex; flex-direction: column; gap: 8px;
    }
    .ref {
      font-size: 13px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .ref:active { background: rgba(10,132,255,0.25); }

    /* ── Sheet ── */
    .sheet-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      display: none; z-index: 20;
    }
    .sheet-backdrop.open { display: block; }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: var(--glass);
      backdrop-filter: blur(80px) saturate(220%);
      -webkit-backdrop-filter: blur(80px) saturate(220%);
      border-radius: 20px 20px 0 0;
      border-top: 0.5px solid rgba(255,255,255,0.10);
      padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px));
      z-index: 21;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
      max-height: 85%;
      overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .sheet::before {
      content: ""; position: absolute; inset: 0;
      border-radius: inherit; pointer-events: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .sheet-handle {
      width: 38px; height: 5px;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      margin: 14px auto 18px;
    }
    .sheet-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 24px 18px;
      border-bottom: 0.5px solid var(--sep);
    }
    .sheet-header .cancel, .sheet-header .save {
      background: none; border: none;
      color: var(--accent);
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
    }
    .sheet-header .save { font-weight: 600; }
    .sheet-header h3 { margin: 0; font-size: 17px; font-weight: 600; }
    .sheet-body { padding: 20px 24px; }
    label.field {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--text3);
      margin: 20px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    label.field:first-child { margin-top: 0; }
    input.f, textarea.f, select.f {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      color: var(--text);
      padding: 14px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    input.f:focus, textarea.f:focus {
      background: rgba(10,132,255,0.06);
      border-color: rgba(10,132,255,0.25);
    }
    textarea.f { min-height: 120px; resize: vertical; line-height: 1.5; }

    /* ── Typing ── */
    .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
    .typing i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text3);
      animation: blink 1.2s infinite;
    }
    .typing i:nth-child(2) { animation-delay: 0.2s; }
    .typing i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

    /* ── Toast ── */
    #toast {
      position: absolute;
      left: 50%; bottom: 110px;
      transform: translateX(-50%) translateY(16px);
      background: var(--glass);
      backdrop-filter: blur(40px);
      color: var(--text);
      padding: 12px 28px;
      border-radius: 22px;
      font-size: 14px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: all 0.28s cubic-bezier(0.32,0.72,0,1);
      z-index: 40;
      border: 0.5px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .empty {
      text-align: center;
      color: var(--text3);
      padding: 80px 24px;
      font-size: 15px; line-height: 1.7;
    }
    .empty .big { font-size: 48px; margin-bottom: 16px; }

    /* ══════════════════════════════════════
       LIQUID GLASS TAB BAR
       ══════════════════════════════════════ */
    .tabbar-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 0 16px 18px;
      gap: 8px;
      pointer-events: none;
    }
    .tabbar {
      display: flex;
      gap: 4px;
      background: rgba(28,28,30,0.55);
      backdrop-filter: blur(60px) saturate(220%);
      -webkit-backdrop-filter: blur(60px) saturate(220%);
      border-radius: var(--r-pill);
      padding: 0 10px;
      height: 44px;
      border: 0.5px solid rgba(255,255,255,0.10);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.35),
        0 2px 8px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.07);
      pointer-events: auto;
      position: relative;
      flex-shrink: 0;
      align-items: center;
    }
    .tabbar::before {
      content: "";
      position: absolute;
      top: 0; left: 12px; right: 12px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      border-radius: 1px;
    }
    .tabbar .tab {
      border: none;
      background: transparent;
      color: var(--text3);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      height: 32px;
      cursor: pointer;
      font-family: inherit;
      border-radius: 16px;
      transition: all 0.25s ease;
    }
    .tabbar .tab svg { width: 18px; height: 18px; }
    .tabbar .tab.active {
      color: var(--accent);
      background: rgba(10,132,255,0.10);
    }

    /* ── Chat input islands ── */
    .chat-islands {
      flex: 1;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .chat-islands.hidden { display: none; }
    .input-island {
      flex: 1;
      height: 44px;
      background: rgba(28,28,30,0.55);
      backdrop-filter: blur(60px) saturate(220%);
      -webkit-backdrop-filter: blur(60px) saturate(220%);
      border-radius: var(--r-pill);
      border: 0.5px solid rgba(255,255,255,0.10);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.35),
        0 2px 8px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.07);
      position: relative;
    }
    .input-island::before {
      content: "";
      position: absolute;
      top: 0; left: 12px; right: 12px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }
    .input-island input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 0 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      border-radius: var(--r-pill);
    }
    .input-island input::placeholder { color: var(--text3); }
    .send-island {
      width: 44px; height: 44px;
      border-radius: 22px;
      border: none;
      background: rgba(28,28,30,0.55);
      backdrop-filter: blur(60px) saturate(220%);
      -webkit-backdrop-filter: blur(60px) saturate(220%);
      color: var(--accent);
      font-size: 18px;
      cursor: pointer;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.35),
        0 2px 8px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.07);
      border: 0.5px solid rgba(255,255,255,0.10);
      flex-shrink: 0;
      transition: all 0.15s;
      display: grid; place-items: center;
    }
    .send-island:active { transform: scale(0.9); background: rgba(10,132,255,0.15); }

    /* Leave room for floating island bar */
    .screen { padding-bottom: 90px; }
  </style>
</head>
<body>
  <div id="phone">
    <div class="statusbar">
      <span id="clock">9:41</span>
      <div class="right">
        <span class="pill ok">飞行模式</span>
        <span>100%</span>
      </div>
    </div>

    <div class="large-title">
      <div class="text">
        <h1 id="pageTitle">资料</h1>
        <p class="sub" id="pageSub">本地知识库</p>
      </div>
      <button class="fab" id="fabAdd">+</button>
    </div>

    <main>
      <section class="screen active" id="screen-entries">
        <div class="stats-row">
          <div class="stat-card glass"><div class="n" id="statCount">4</div><div class="l">资料</div></div>
          <div class="stat-card glass"><div class="n" id="statReady">3</div><div class="l">已向量</div></div>
        </div>
        <div class="filters" id="filters">
          <button class="fchip on" data-cat="info">信息</button>
          <button class="fchip" data-cat="like">喜好</button>
          <button class="fchip" data-cat="plan">日程</button>
          <button class="fchip" data-cat="other">其它</button>
        </div>
        <div id="entryList"></div>
      </section>

      <section class="screen" id="screen-chat">
        <div class="chat-wrap">
          <div class="chat-log" id="chatLog"></div>
        </div>
      </section>
    </main>

    <!-- Bottom island bar -->
    <div class="tabbar-wrap">
      <div class="tabbar">
        <button class="tab active" data-screen="entries">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h8M8 12h6M8 16h4"/></svg>
        </button>
        <button class="tab" data-screen="chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-3.68-.71L3 21l1.71-4.04C3.63 15.58 3 13.85 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </button>
      </div>
      <div class="chat-islands hidden" id="chatIslands">
        <div class="input-island">
          <input id="chatInput" type="text" placeholder="根据我的资料回答…" autocomplete="off" />
        </div>
        <button class="send-island" id="chatSend">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

    <div class="sheet-backdrop" id="sheetBd"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <button class="cancel" id="sheetCancel">取消</button>
        <h3 id="sheetTitle">新建资料</h3>
        <button class="save" id="sheetSave">保存</button>
      </div>
      <div class="sheet-body">
        <label class="field">标题</label>
        <input class="f" id="fTitle" placeholder="输入标题" maxlength="40" />
        <label class="field">分类</label>
        <select class="f" id="fCat">
          <option value="info">信息</option>
          <option value="like">喜好</option>
          <option value="plan">日程</option>
          <option value="other">其它</option>
        </select>
        <label class="field">内容</label>
        <textarea class="f" id="fBody" placeholder="写下你想记住的…" maxlength="20000"></textarea>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <script>
    const CAT = {
      info: { name: "信息", cls: "info" },
      like: { name: "喜好", cls: "like" },
      plan: { name: "日程", cls: "plan" },
      other: { name: "其它", cls: "other" }
    };

    const seed = [
      { id: 1, title: "基本信息", cat: "info", body: "身高 175cm，体重 68kg，血型 O。目标是保持体脂稳定，优先规律作息。", status: "ready", updated: "今天" },
      { id: 2, title: "饮食喜好", cat: "like", body: "不吃香菜。偏好清淡中餐，早餐常喝燕麦牛奶。对花生过敏。", status: "ready", updated: "昨天" },
      { id: 3, title: "本周日程", cat: "plan", body: "周三 19:30 牙医复诊；周五下午产品评审；周日想整理房间。", status: "ready", updated: "周一" },
      { id: 4, title: "生理期记录", cat: "info", body: "最近一次开始：本月 3 日，周期约 28 天，经期 5 天左右。", status: "pending", updated: "刚刚" }
    ];

    let entries = [...seed];
    let filter = "info";
    let editingId = null;
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    function toast(msg) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove("show"), 1800);
    }

    function clock() {
      const d = new Date();
      $("#clock").textContent =
        String(d.getHours()).padStart(2, "0") + ":" +
        String(d.getMinutes()).padStart(2, "0");
    }
    clock(); setInterval(clock, 30000);

    function renderEntries() {
      const list = entries.filter(e => e.cat === filter);
      $("#statCount").textContent = entries.length;
      $("#statReady").textContent = entries.filter(e => e.status === "ready").length;
      const box = $("#entryList");
      if (!list.length) {
        box.innerHTML = '<div class="empty"><div class="big" style="opacity:.15;font-size:64px">∅</div>还没有资料<br/>点标题右侧 + 开始录入</div>';
        return;
      }
      box.innerHTML = '<div class="entry-group glass">' + list.map(e => {
        const c = CAT[e.cat] || CAT.other;
        const st = e.status === "ready"
          ? '<span class="badge ok">已向量</span>'
          : e.status === "pending"
            ? '<span class="badge warn">向量中</span>'
            : '<span class="badge">失败</span>';
        return `
          <div class="row-item" data-edit="${e.id}">
            <div class="body">
              <p class="title">${esc(e.title)}</p>
              <p class="desc">${esc(e.body)}</p>
              <div class="meta">
                ${st}
                <span class="badge">${esc(e.updated)}</span>
              </div>
            </div>
            <span class="chevron">›</span>
          </div>`;
      }).join("") + '</div>';
      box.querySelectorAll("[data-edit]").forEach(el => {
        el.addEventListener("click", () => openSheet(Number(el.dataset.edit)));
      });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    function openSheet(id) {
      editingId = id || null;
      if (id) {
        const e = entries.find(x => x.id === id);
        if (!e) return;
        $("#sheetTitle").textContent = "编辑";
        $("#fTitle").value = e.title;
        $("#fCat").value = e.cat;
        $("#fBody").value = e.body;
      } else {
        $("#sheetTitle").textContent = "新建资料";
        $("#fTitle").value = "";
        $("#fCat").value = "info";
        $("#fBody").value = "";
      }
      $("#sheetBd").classList.add("open");
      requestAnimationFrame(() => $("#sheet").classList.add("open"));
    }

    function closeSheet() {
      $("#sheet").classList.remove("open");
      setTimeout(() => $("#sheetBd").classList.remove("open"), 380);
      editingId = null;
    }

    $("#fabAdd").addEventListener("click", () => openSheet(null));
    $("#sheetCancel").addEventListener("click", closeSheet);
    $("#sheetBd").addEventListener("click", closeSheet);

    $("#sheetSave").addEventListener("click", () => {
      const title = $("#fTitle").value.trim() || "未命名";
      const cat = $("#fCat").value;
      const body = $("#fBody").value.trim();
      if (!body) { toast("内容不能为空"); return; }
      const now = "刚刚";
      if (editingId) {
        const e = entries.find(x => x.id === editingId);
        Object.assign(e, { title, cat, body, status: "pending", updated: now });
        toast("已更新");
      } else {
        entries.unshift({ id: Date.now(), title, cat, body, status: "pending", updated: now });
        toast("已保存");
      }
      closeSheet();
      renderEntries();
      setTimeout(() => {
        entries.forEach(e => { if (e.status === "pending") e.status = "ready"; });
        renderEntries();
      }, 1200);
    });

    $("#filters").addEventListener("click", ev => {
      const b = ev.target.closest(".fchip");
      if (!b) return;
      filter = b.dataset.cat;
      $$(".fchip").forEach(x => x.classList.toggle("on", x === b));
      renderEntries();
    });

    // Tabs
    const meta = {
      entries: { t: "资料", s: "" },
      chat: { t: "问答", s: "" }
    };
    $$(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        const id = tab.dataset.screen;
        $$(".tab").forEach(t => t.classList.toggle("active", t === tab));
        $$(".screen").forEach(s => s.classList.toggle("active", s.id === "screen-" + id));
        $("#pageTitle").textContent = meta[id].t;
        $("#pageSub").textContent = meta[id].s;
        $("#fabAdd").style.display = id === "entries" ? "block" : "none";
        // Show/hide chat input islands
        $("#chatIslands").classList.toggle("hidden", id !== "chat");
      });
    });

    // Chat
    function scoreSim(q, e) {
      const t = (e.title + e.body + (CAT[e.cat]?.name || "")).toLowerCase();
      const c = [...new Set(q.replace(/\s/g, ""))];
      let h = 0;
      c.forEach(ch => { if (t.includes(ch)) h++; });
      return c.length ? h / c.length : 0;
    }
    function retrieve(q) {
      return entries.filter(e => e.status === "ready")
        .map(e => ({ e, score: scoreSim(q, e) }))
        .filter(x => x.score >= 0.25)
        .sort((a, b) => b.score - a.score)
        .slice(0, 2);
    }
    function mockAnswer(q, hits) {
      if (!hits.length) return "暂无相关个人资料";
      if (q.includes("身高") || q.includes("体重"))
        return "根据你的档案：身高 175cm，体重 68kg。目标是保持体脂稳定、优先规律作息。";
      if (q.includes("吃") || q.includes("饮食") || q.includes("花生") || q.includes("香菜"))
        return "你偏好清淡中餐，早餐常燕麦牛奶；不吃香菜，对花生过敏，点餐时注意避开含花生食品。";
      if (q.includes("周") || q.includes("安排") || q.includes("日程"))
        return "本周安排：周三 19:30 牙医复诊；周五下午产品评审；周日想整理房间。";
      if (q.includes("姨妈") || q.includes("生理") || q.includes("经期"))
        return "根据你的记录：最近一次大约从本月 3 日开始，周期约 28 天，经期约 5 天。第 1–2 天容易乏力，建议少排重活。";
      return `根据「${hits[0].e.title}」：${hits[0].e.body.slice(0, 80)}${hits[0].e.body.length > 80 ? "…" : ""}`;
    }
    function addBubble(role, html) {
      const log = $("#chatLog");
      const d = document.createElement("div");
      d.className = "bubble " + role;
      d.innerHTML = html;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;
    }
    function ask(q) {
      q = (q || "").trim();
      if (!q) return;
      addBubble("user", esc(q));
      const typing = addBubble("bot", '<span class="typing"><i></i><i></i><i></i></span>');
      $("#chatSend").disabled = true;
      setTimeout(() => {
        const hits = retrieve(q);
        const ans = mockAnswer(q, hits);
        const refs = hits.length
          ? `<div class="refs">${hits.map(h =>
              `<div class="ref" data-ref="${h.e.id}">📎 ${esc(h.e.title)} · ${(h.score * 100).toFixed(0)}%</div>`
            ).join("")}</div>`
          : "";
        typing.innerHTML = esc(ans).replace(/\n/g, "<br/>") + refs;
        typing.querySelectorAll("[data-ref]").forEach(r => {
          r.addEventListener("click", () => {
            $$(".tab")[0].click();
            toast("已定位到引用");
          });
        });
        $("#chatSend").disabled = false;
        $("#chatLog").scrollTop = $("#chatLog").scrollHeight;
      }, 700 + Math.random() * 400);
    }
    $("#chatSend").addEventListener("click", () => { ask($("#chatInput").value); $("#chatInput").value = ""; });
    $("#chatInput").addEventListener("keydown", e => { if (e.key === "Enter") { ask($("#chatInput").value); $("#chatInput").value = ""; } });

    renderEntries();
  </script>
</body>
</html>
